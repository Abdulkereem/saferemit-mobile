name: Build & Deploy to Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      # Decode the keystore from the GitHub secret and write it to disk
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/saferemit-release.jks

      # Write key.properties so build.gradle.kts can find signing config
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/saferemit-release.jks
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: saferemit-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Deploy to Play Store internal track
      # Requires PLAY_STORE_JSON_KEY secret (Google Play service account JSON)
      - name: Deploy to Play Store (internal track)
        if: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: finance.saferemit.saferemit_mobile
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
