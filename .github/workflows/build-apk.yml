name: Build & Deploy to Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Sign & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Get Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Set version code from run number
        run: |
          # Use GitHub run number as ever-increasing version code
          VERSION_CODE=${{ github.run_number }}
          # Preserve version name, only bump the build number
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          sed -i "s/^version: .*/version: ${CURRENT}+${VERSION_CODE}/" pubspec.yaml
          echo "Version: ${CURRENT}+${VERSION_CODE}"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/saferemit-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=saferemit-release.jks
          EOF
          # Strip leading whitespace added by heredoc indentation
          sed -i 's/^[[:space:]]*//' android/key.properties

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: saferemit-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Deploy via Fastlane
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: bundle exec fastlane deploy
